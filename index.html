<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Selected Club</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
/* YOUR FULL ORIGINAL STYLES (UNCHANGED) */
:root {
  --bg-top:#08142b;
  --bg-bottom:#020617;
  --card:#0f1c35;
  --block:#0a1630;
  --line:#1c2a4a;
  --gold:#d4af37;
  --green:#2ecc71;
  --red:#ff5a5a;
  --text:#ffffff;
  --muted:rgba(255,255,255,0.78);
  --shadow:0 10px 30px rgba(0,0,0,0.25);
}
*{box-sizing:border-box;}
body{margin:0;font-family:Arial;background:linear-gradient(180deg,var(--bg-top),var(--bg-bottom));color:var(--text);}
.container{max-width:560px;margin:auto;padding:20px;}
.center{text-align:center;}
.card{background:var(--card);padding:22px;border-radius:18px;margin-top:26px;}
.block{background:var(--block);padding:16px;border-radius:14px;margin-top:16px;}
.btn{width:100%;padding:17px;border:none;border-radius:14px;margin-top:18px;font-size:17px;font-weight:bold;cursor:pointer;}
.primary{background:var(--gold);color:#000;}
.green{background:var(--green);color:#fff;}
.dark{background:var(--line);color:#fff;}
.small{font-size:13px;color:var(--muted);}
</style>
</head>

<body>
<div class="container">

<!-- HERO -->
<div class="center">
<h1>ENTER THIS WEEK’S £1000 DRAW</h1>
<div id="countdown">0d / 0h / 0m</div>
</div>

<!-- MAIN DRAW COUNTER -->
<div class="block">
<div id="entriesText">Loading...</div>
<div style="height:10px;background:#1c2a4a;border-radius:10px;">
<div id="progressBar" style="height:10px;width:0%;background:#2ecc71;"></div>
</div>
</div>

<!-- SELECTED DROPS TITLE -->
<div class="section-title">Selected Drops</div>

<!-- 🔥 LIVE DROP COUNTER -->
<div class="block center">
<div id="ticketCounter" style="color:#d4af37;font-weight:bold;">
Loading tickets...
</div>
</div>

<!-- DROP CARD -->
<div class="card">

<div class="block">
<div>Choose entries</div>
<div class="qty">
<button onclick="changeDrop(-1)">-</button>
<div id="dropQty">0</div>
<button onclick="changeDrop(1)">+</button>
</div>
</div>

<div id="dropQ" class="block hidden">
<div>What is 2 + 3?</div>
<div class="option" onclick="selectDropAnswer(this,false)">7</div>
<div class="option" onclick="selectDropAnswer(this,true)">5</div>
<div class="option" onclick="selectDropAnswer(this,false)">9</div>
</div>

<button class="btn green" onclick="checkoutDirect()">Enter Drop</button>

</div>

</div>

<!-- POPUP (FIXED) -->
<div id="popup" class="popup">
<div class="popup-box">

<div class="option" onclick="selectPopupAnswer(this,false)">7</div>
<div class="option" onclick="selectPopupAnswer(this,true)">5</div>
<div class="option" onclick="selectPopupAnswer(this,false)">9</div>

</div>
</div>

<script>

/* STATE */
let dropQty = 0;
let dropCorrect = false;

/* COUNTDOWN */
function getNextSunday5pm(){
  const now=new Date();
  const target=new Date(now);
  const day=now.getDay();
  const diff=(7-day)%7;
  target.setDate(now.getDate()+diff);
  target.setHours(17,0,0,0);
  if(now>target) target.setDate(target.getDate()+7);
  return target;
}

function updateCountdown(){
  const now=new Date();
  const target=getNextSunday5pm();
  const diff=target-now;
  const d=Math.floor(diff/86400000);
  const h=Math.floor((diff%86400000)/3600000);
  const m=Math.floor((diff%3600000)/60000);
  document.getElementById("countdown").innerText =
    d+"d / "+h+"h / "+m+"m";
}

setInterval(updateCountdown,1000);
updateCountdown();

/* DROP QTY */
function changeDrop(v){
  dropQty+=v;
  if(dropQty<0) dropQty=0;
  document.getElementById("dropQty").innerText=dropQty;

  if(dropQty>0){
    document.getElementById("dropQ").classList.remove("hidden");
  } else {
    document.getElementById("dropQ").classList.add("hidden");
    dropCorrect=false;
  }
}

/* ANSWER */
function selectDropAnswer(el,correct){
  document.querySelectorAll("#dropQ .option")
    .forEach(o=>o.classList.remove("correct","wrong"));

  if(correct){
    el.classList.add("correct");
    dropCorrect=true;
  } else {
    el.classList.add("wrong");
    dropCorrect=false;
  }
}

/* CHECKOUT */
async function checkoutDirect(){
  if(dropQty===0) return alert("Select entries");
  if(!dropCorrect) return alert("Answer question");

  const res=await fetch("/.netlify/functions/create-checkout",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({mainQty:0,dropQty})
  });

  const data=await res.json();
  if(data.url) window.location.href=data.url;
}

/* MAIN DRAW */
async function loadEntries(){
  const res=await fetch("/.netlify/functions/get-entries");
  const data=await res.json();

  const remaining=data.max_entries-data.total_entries;

  document.getElementById("entriesText").innerText =
    remaining+" entries remaining";

  const pct=(data.total_entries/data.max_entries)*100;
  document.getElementById("progressBar").style.width=pct+"%";
}
loadEntries();

/* 🔵 SUPABASE DROP COUNTER */
const supabaseClient = supabase.createClient(
  "https://vsjogbiquxmbwiacvjym.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzam9nYmlxdXhtYndpYWN2anltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NjA5MzAsImV4cCI6MjA5MDUzNjkzMH0.mI9z3D_oIsOb1crnx8_tzj3J3w5Cq7VBVXIfkEsgsH0"
);

async function loadDropCounter(){
  const {data,error}=await supabaseClient
    .from("drops")
    .select("total_entries")
    .eq("is_active",true)
    .single();

  if(error||!data){
    console.log("Drop error",error);
    return;
  }

  document.getElementById("ticketCounter").innerText =
    data.total_entries+" tickets bought so far in this round";
}

loadDropCounter();
setInterval(loadDropCounter,5000);

</script>

</body>
</html>
